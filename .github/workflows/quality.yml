name: Quality and security checks
on:
  pull_request:
  push:
    branches: [feat/premium-site-redesign-brochure-2026]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
