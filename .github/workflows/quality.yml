name: Quality and security checks
on:
  pull_request:
  push:
    branches: [feat/premium-site-redesign-brochure-2026]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        if: success() || failure()
        run: npm run lint
      - name: Dependency security audit
        if: success() || failure()
        run: npm audit --audit-level=high
      - name: Production build
        if: success() || failure()
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
